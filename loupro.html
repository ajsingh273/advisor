<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strict 4-Step Labouchere</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}
body{
    background:#0b0f19;
    color:white;
    padding:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}
.container{
    width:100%;
    max-width:480px;
}
.card{
    background:#131d2d;
    border-radius:16px;
    padding:24px;
    box-shadow:0 8px 30px rgba(0,0,0,.5);
    border: 1px solid #1e293b;
}
h1{
    text-align:center;
    font-size:20px;
    margin-bottom:4px;
    color:#38bdf8;
}
.subtitle{
    text-align:center;
    color:#94a3b8;
    margin-bottom:16px;
    font-size:13px;
}
.settings{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#0f172a;
    padding:10px 16px;
    border-radius:10px;
    border: 1px solid #1e293b;
    margin-bottom:14px;
}
.settings label{
    color:#cbd5e1;
    font-size:13px;
}
.settings input{
    width:80px;
    padding:6px;
    border:none;
    border-radius:8px;
    background:#1e293b;
    color:white;
    font-size:16px;
    text-align:center;
    outline:none;
}
.main-display {
    background: #0f172a;
    padding: 16px;
    border-radius: 12px;
    text-align: center;
    border: 1px solid #1e293b;
    margin-bottom: 14px;
}
.bet-label {
    font-size: 11px;
    color: #94a3b8;
    text-transform: uppercase;
    letter-spacing: 1px;
}
.bet{
    font-size:36px;
    margin:4px 0;
    font-weight:bold;
    color:#f8fafc;
}
.target-profit {
    font-size: 13px;
    color: #34d399;
    font-weight: bold;
}
.stats-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 14px;
}
.stat-box {
    background: #0f172a;
    border: 1px solid #1e293b;
    padding: 8px;
    border-radius: 8px;
    text-align: center;
}
.stat-label {
    font-size: 10px;
    color: #94a3b8;
    text-transform: uppercase;
}
.stat-val {
    font-size: 15px;
    font-weight: bold;
    color: #38bdf8;
    margin-top: 2px;
}
.sequenceTitle{
    text-align:center;
    color:#94a3b8;
    font-size:11px;
    text-transform: uppercase;
    margin-bottom:6px;
    letter-spacing: 1px;
}
.sequence{
    background:#0f172a;
    padding:12px;
    border-radius:10px;
    text-align:center;
    font-size:18px;
    font-weight:bold;
    color:#7dd3fc;
    letter-spacing:1px;
    word-break:break-all;
    border: 1px solid #1e293b;
    margin-bottom:14px;
}
.log-box {
    background: #0f172a;
    border: 1px solid #1e293b;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 11px;
    color: #94a3b8;
    margin-bottom: 16px;
    min-height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}
button{
    width:100%;
    border:none;
    padding:14px;
    border-radius:10px;
    font-size:16px;
    margin-bottom:10px;
    cursor:pointer;
    transition:.2s;
    font-weight:bold;
}
button:hover{
    filter:brightness(1.1);
}
.win{
    background:#059669;
    color:white;
}
.loss{
    background:#dc2626;
    color:white;
}
.reset{
    background:transparent;
    color:#64748b;
    padding:6px;
    font-size:12px;
    margin-top:2px;
}
.reset:hover{
    color:#cbd5e1;
    filter:none;
}
.complete{
    color:#34d399;
    font-size:18px;
}
.disabled{
    opacity:.4;
    cursor:not-allowed;
}
#passwordModal{
    position:fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;

    background:#101820;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:999999;

    padding:20px;
}

.password-box{
    width:100%;
    max-width:420px;

    background:#1d2938;

    border-radius:18px;

    padding:30px 25px;

    box-shadow:0 8px 40px rgba(0,0,0,.6);

    text-align:center;
}

.password-box h2{
    margin-bottom:10px;
    color:white;
}

.password-box p{
    color:#8fa6c3;
    margin-bottom:25px;
}

.password-box input{
    width:100%;

    padding:16px;

    border:none;
    border-radius:12px;

    background:#0f172a;
    color:white;

    font-size:20px;

    text-align:center;

    outline:none;
}

.password-box input:focus{
    box-shadow:0 0 0 2px #7dd3fc;
}

.password-box button{
    width:100%;

    border:none;
    padding:16px;

    border-radius:12px;

    font-size:20px;

    margin-top:15px;

    cursor:pointer;

    background:#10b981;
    color:white;
}

.password-box button:hover{
    filter:brightness(1.1);
}

#passwordError{
    color:#f87171;

    margin-top:15px;

    min-height:24px;

    font-weight:bold;
}
</style>
</head>

<body>
<div id="passwordModal">

    <div class="password-box">

        <h2>🔒 Protected App</h2>

        <p>
            Enter password to continue
        </p>

        <input
            type="password"
            id="appPassword"
            placeholder="Enter Password"
            autocomplete="off"
        >

        <button onclick="checkPassword()">
            UNLOCK
        </button>

        <div id="passwordError"></div>

    </div>

</div>
<div class="container">
<div class="card">
    <h1>Strict 4-Step Labouchere</h1>
    <div class="subtitle">American Roulette • Mathematically Guaranteed Recovery</div>

    <div class="settings">
        <label for="unitAmount">Base Unit ($)</label>
        <input type="number" id="unitAmount" value="5" min="1" step="1" oninput="update()">
    </div>

    <div class="stats-grid">
        <div class="stat-box">
            <div class="stat-label">Wins</div>
            <div class="stat-val" id="winCount">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Losses</div>
            <div class="stat-val" id="lossCount">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Streak</div>
            <div class="stat-val" id="streakCount">0</div>
        </div>
    </div>

    <div class="main-display">
        <div class="bet-label" id="stepLabel">Next Bet</div>
        <div class="bet" id="betDisplay">$10.00</div>
        <div class="target-profit" id="targetProfitDisplay">Target Profit on Win: $20.00</div>
    </div>

    <div class="sequenceTitle">Active Sequence (Max 4)</div>
    <div class="sequence" id="sequenceDisplay">1 - 1 - 1 - 1</div>

    <div class="log-box" id="logDisplay">Session started. Ready for spin outcome.</div>

    <button class="win" id="winButton" onclick="win()">WIN</button>
    <button class="loss" id="lossButton" onclick="loss()">LOSS</button>
    <button class="reset" onclick="resetGame()">Reset Session</button>
</div>
</div>
<script>

const APP_PASSWORD = "YOURPASSW0RD";

function checkPassword(){

    const entered =
        document.getElementById("appPassword").value;

    if(entered === APP_PASSWORD){

        document.getElementById("passwordModal").style.display = "none";

    }else{

        document.getElementById("passwordError").textContent =
            "Incorrect password.";

        document.getElementById("appPassword").value = "";

        document.getElementById("appPassword").focus();

    }

}


/* Allow ENTER key to submit */

document.getElementById("appPassword").addEventListener(
    "keydown",
    function(event){

        if(event.key === "Enter"){
            checkPassword();
        }

    }
);


/* Automatically place cursor in password field */

window.addEventListener("load", function(){

    document.getElementById("appPassword").focus();

});

</script>
<script>
const baseSequence = [1, 1, 1, 1];
let sequence = [...baseSequence];

let totalWins = 0;
let totalLosses = 0;
let currentStreak = 0;

function money(amount){
    return new Intl.NumberFormat('en-US', { style:'currency', currency:'USD' }).format(amount);
}

function getUnit(){
    let val = parseFloat(document.getElementById("unitAmount").value);
    return (isNaN(val) || val <= 0) ? 5 : val;
}

function getBetUnits(){
    if(sequence.length === 0) return 0;
    if(sequence.length === 1) return sequence[0];
    return sequence[0] + sequence[sequence.length - 1];
}

function update(){
    const unit = getUnit();
    const seqDisp = document.getElementById("sequenceDisplay");
    const betDisp = document.getElementById("betDisplay");
    const targetDisp = document.getElementById("targetProfitDisplay");
    const winBtn = document.getElementById("winButton");
    const lossBtn = document.getElementById("lossButton");
    const stepLabel = document.getElementById("stepLabel");
    
    document.getElementById("winCount").innerText = totalWins;
    document.getElementById("lossCount").innerText = totalLosses;
    document.getElementById("streakCount").innerText = currentStreak;

    if(sequence.length === 0){
        seqDisp.innerHTML = '<span class="complete">SESSION COMPLETE ✓</span>';
        betDisp.innerHTML = "$0.00";
        targetDisp.innerHTML = "Profit secured successfully!";
        stepLabel.innerHTML = "Status";
        winBtn.disabled = true; lossBtn.disabled = true;
        winBtn.classList.add("disabled"); lossBtn.classList.add("disabled");
        return;
    }

    winBtn.disabled = false; lossBtn.disabled = false;
    winBtn.classList.remove("disabled"); lossBtn.classList.remove("disabled");
    stepLabel.innerHTML = "Next Bet";

    seqDisp.innerHTML = sequence.join(" - ");

    const totalUnits = getBetUnits();
    const totalDollarBet = totalUnits * unit;
    betDisp.innerHTML = money(totalDollarBet);

    let sumUnits = sequence.reduce((a, b) => a + b, 0);
    let targetProfit = sumUnits * unit;
    targetDisp.innerHTML = `Target Profit on Win: ${money(targetProfit)}`;
}

function win(){
    if(sequence.length === 0) return;
    
    const prevBet = getBetUnits();
    
    if(sequence.length === 1){
        sequence.pop();
    } else {
        sequence.shift();
        sequence.pop();
    }
    
    totalWins++;
    currentStreak = currentStreak > 0 ? currentStreak + 1 : 1;
    
    let logMsg = `Captured WIN on ${money(prevBet * getUnit())}. Sequence updated.`;
    if(sequence.length === 0) logMsg = `🎉 Session Completed Successfully!`;
    document.getElementById("logDisplay").innerText = logMsg;
    
    update();
}

function loss(){
    if(sequence.length === 0) return;
    
    const currentBetUnits = getBetUnits();
    const currentSum = sequence.reduce((a, b) => a + b, 0);
    
    // MATHEMATICALLY CORRECT RECOVERY:
    // New total sequence sum must absorb the lost bet + a progressive profit bonus
    const profitBonus = Math.max(1, Math.round(currentBetUnits * 0.25));
    const newSum = currentSum + currentBetUnits + profitBonus;
    
    // Redistribute the exact new sum strictly into 4 balanced sequence numbers
    let s1 = Math.max(1, Math.floor(newSum * 0.20));
    let s2 = Math.max(1, Math.floor(newSum * 0.25));
    let s3 = Math.max(1, Math.round(newSum * 0.25));
    let s4 = newSum - (s1 + s2 + s3);
    if(s4 < 1) s4 = 1;

    sequence = [s1, s2, s3, s4];
    
    totalLosses++;
    currentStreak = currentStreak < 0 ? currentStreak - 1 : -1;
    
    const newBet = getBetUnits() * getUnit();
    document.getElementById("logDisplay").innerText = `Captured LOSS. Bet adjusted to ${money(newBet)} (Max 4 steps).`;
    
    update();
}

function resetGame(){
    sequence = [...baseSequence];
    totalWins = 0;
    totalLosses = 0;
    currentStreak = 0;
    document.getElementById("logDisplay").innerText = "Session reset to base 4-step sequence.";
    update();
}

update();
</script>
</body>
</html>
