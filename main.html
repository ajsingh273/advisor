<!DOCTYPE html>
<html>
<head>
<title>Two Dozen Exclusion Strategy</title>
<style>
body {
    font-family: Arial, sans-serif;
    max-width: 600px;
    margin: 30px auto;
    padding: 20px;
    background: #f4f4f4;
}

h2 {
    text-align: center;
}

.box {
    background: white;
    padding: 20px;
    border-radius: 10px;
}

select, button {
    padding: 10px;
    margin: 5px;
    font-size: 16px;
}

button {
    background: #1b7f3a;
    color: white;
    border: none;
    border-radius: 5px;
    cursor: pointer;
}

button:hover {
    background: #145c2b;
}

.result {
    margin-top: 20px;
    padding: 15px;
    background: #e8f5e9;
    border-radius: 8px;
    font-size: 18px;
}
</style>
</head>

<body>

<div class="box">

<h2>Two-Dozen Exclusion Strategy</h2>

<p>Enter last 5 dozen results:</p>

<div id="fiveSpins">
<select></select>
<select></select>
<select></select>
<select></select>
<select></select>
</div>

<p>Enter 6th spin:</p>

<select id="sixth"></select>

<br><br>

<button onclick="calculate()">Generate Next 4 Bets</button>

<div class="result" id="output"></div>

</div>


<script>

const options = `
<option value="D1">D1</option>
<option value="D2">D2</option>
<option value="D3">D3</option>
`;

document.querySelectorAll("select").forEach(s => {
    s.innerHTML = options;
});


function rotateClockwise(dozen) {
    if (dozen === "D1") return "D2";
    if (dozen === "D2") return "D3";
    if (dozen === "D3") return "D1";
}


function betFromExclusion(exclude) {

    if (exclude === "D1")
        return "Bet D2 + D3";

    if (exclude === "D2")
        return "Bet D1 + D3";

    if (exclude === "D3")
        return "Bet D1 + D2";
}


function calculate() {

    let spins = [];

    document.querySelectorAll("#fiveSpins select").forEach(s => {
        spins.push(s.value);
    });

    let sixth = document.getElementById("sixth").value;

    let exclusions = [...spins];

    let message = "";

    if (sixth === spins[0]) {

        message += "6th spin MATCHES 1st spin → Clockwise rotation applied.<br><br>";

        exclusions = exclusions.map(x => rotateClockwise(x));

    } else {

        message += "6th spin DOES NOT MATCH 1st spin → Pattern kept unchanged.<br><br>";

    }


    message += "<b>Next 4 Two-Dozen Bets:</b><br><br>";

    for (let i = 0; i < 4; i++) {

        message += 
        "Spin " + (i+1) + 
        ": Exclude " + exclusions[i] +
        " → " +
        betFromExclusion(exclusions[i]) +
        "<br>";

    }


    message += "<br><b>Continue:</b><br>";
    message += "Enter the next 5 dozen results after these bets if another cycle is needed.";

    document.getElementById("output").innerHTML = message;

}

</script>

</body>
</html>
