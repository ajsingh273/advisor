<!DOCTYPE html>
<html>
<head>
<title>Advisor</title>
<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    max-width: 600px;
    margin: 0 auto;
    padding: 12px;
    background: #f4f4f4;
}

h2 {
    text-align: center;
    margin-top: 0;
    margin-bottom: 18px;
}

.box {
    background: white;
    padding: 18px;
    border-radius: 10px;
}

#fiveSpins {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    margin-bottom: 15px;
}

select {
    width: 100%;
    height: 48px;
    font-size: 18px;
    text-align: center;
}

#sixth {
    width: 100%;
    height: 50px;
    font-size: 18px;
    margin-top: 6px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 18px;
    font-size: 18px;
    background: #1b7f3a;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

button:hover {
    background: #145c2b;
}

.result {
    margin-top: 18px;
    padding: 15px;
    background: #e8f5e9;
    border-radius: 8px;
    font-size: 17px;
    line-height: 1.5;
}

/* Portrait phones */
@media (max-width: 600px) {

    body {
        padding: 8px;
    }

    .box {
        padding: 14px;
    }

    #fiveSpins {
        gap: 6px;
    }

    select {
        height: 52px;
        font-size: 18px;
    }
}

/* Landscape phones */
@media (max-width: 900px) and (orientation: landscape) {

    body {
        max-width: 100%;
        padding: 8px;
    }

    .box {
        padding: 12px 16px;
    }

    h2 {
        font-size: 22px;
        margin-bottom: 12px;
    }

    p {
        margin: 8px 0;
    }

    #fiveSpins {
        gap: 10px;
    }

    select {
        height: 60px;
        font-size: 22px;
        font-weight: bold;
    }

    #sixth {
        height: 60px;
        font-size: 22px;
    }

    button {
        height: 60px;
        font-size: 22px;
        margin-top: 12px;
    }

    .result {
        font-size: 18px;
        margin-top: 14px;
    }
}
</style>
</head>

<body>

<div class="box">

<h2>Advisor</h2>

<p>Enter the last 5:</p>

<div id="fiveSpins">
<select></select>
<select></select>
<select></select>
<select></select>
<select></select>
</div>

<p>Enter 6th:</p>

<select id="sixth"></select>

<br><br>

<button onclick="calculate()">Generate Next 4</button>

<div class="result" id="output"></div>

</div>


<script>

const options = `
<option value="D1">D1</option>
<option value="D2">D2</option>
<option value="D3">D3</option>
`;

document.querySelectorAll("select").forEach(s => {
    s.innerHTML = options;
});


function rotateClockwise(dozen) {
    if (dozen === "D1") return "D2";
    if (dozen === "D2") return "D3";
    if (dozen === "D3") return "D1";
}


function betFromExclusion(exclude) {

    if (exclude === "D1")
        return "Bet D2 + D3";

    if (exclude === "D2")
        return "Bet D1 + D3";

    if (exclude === "D3")
        return "Bet D1 + D2";
}


function calculate() {

    let spins = [];

    document.querySelectorAll("#fiveSpins select").forEach(s => {
        spins.push(s.value);
    });

    let sixth = document.getElementById("sixth").value;

    let exclusions = [...spins];

    let message = "";

    if (sixth === spins[0]) {

        message += "6th MATCHES 1st → Clockwise rotation applied.<br><br>";

        exclusions = exclusions.map(x => rotateClockwise(x));

    } else {

        message += "6th DOES NOT MATCH 1st → Pattern kept unchanged.<br><br>";

    }


    message += "<b>Next 4:</b><br><br>";

    for (let i = 0; i < 4; i++) {

        message += 
        "Spin " + (i+1) + 
        ": Exclude " + exclusions[i] +
        " → " +
        betFromExclusion(exclusions[i]) +
        "<br>";

    }


    message += "<br><b>Continue:</b><br>";
    message += "Enter the next 5 results after if another cycle is needed.";

    document.getElementById("output").innerHTML = message;

}

</script>

</body>
</html>
