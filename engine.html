<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Engine V2</title>

<style>

body{

    font-family:Arial,sans-serif;
    max-width:450px;
    margin:auto;
    padding:20px;
    background:#111;
    color:white;

}


h1{

    text-align:center;
    color:#00ff99;

}


.box{

    background:#1d1d1d;
    padding:15px;
    border-radius:10px;
    margin-top:15px;

}


select,
button{

    width:100%;
    padding:12px;
    margin-top:10px;
    font-size:18px;
    border-radius:8px;

}


select{

    background:#222;
    color:white;
    border:1px solid #555;

}


button{

    background:#00aa66;
    color:white;
    border:none;

}


.label{

    color:#aaa;
    font-size:14px;

}


.value{

    text-align:center;
    font-size:26px;
    color:#00ff99;
    margin:10px;

}


.small{

    color:#ccc;
    line-height:1.5;

}


</style>

</head>


<body>


<h1>
Two Dozen Exclusion Engine V2
</h1>



<div class="box">

<div class="label">
Enter Last 5 Dozen Results
</div>


<select class="spin"></select>
<select class="spin"></select>
<select class="spin"></select>
<select class="spin"></select>
<select class="spin"></select>


<button onclick="analyze()">
ANALYZE PATTERN
</button>


</div>




<div class="box">


<div class="label">
Observed Pattern
</div>


<div id="pattern" class="value">
--
</div>


<div class="label">
Recommendation
</div>


<div id="result" class="value">
--
</div>


<div class="label">
Confidence
</div>


<div id="confidence" class="value">
--
</div>


</div>




<div class="box">


<div class="label">
Engine Data
</div>


<div id="details" class="small">

Waiting for analysis...

</div>


</div>


<div class="box">

<div class="label">
LIVE CYCLE TRACKING
</div>

<select id="liveSpin">

<option>D1</option>
<option>D2</option>
<option>D3</option>

</select>


<button onclick="submitLiveSpin()">
SUBMIT NEXT DOZEN
</button>


<div id="liveStatus" class="small">

Waiting for cycle...

</div>


</div>


<div class="box">

<div class="label">
SESSION RESULTS
</div>

<div id="stats" class="small">

No cycles completed.

</div>

</div>





<script>


// =====================================
// TWO DOZEN EXCLUSION ENGINE V2
// PART 1
// CORE DATA MODEL
// =====================================



const DOZENS = [

"D1",
"D2",
"D3"

];




let session = {

history:[],

currentExclude:null,

currentPlay:[],

pattern:"",

confidence:0,

wins:0,

losses:0,

cycles:0

};



// -------------------------------------
// Initialize Inputs
// -------------------------------------


document
.querySelectorAll(".spin")
.forEach(select=>{


select.innerHTML = `

<option>D1</option>
<option>D2</option>
<option>D3</option>

`;


});





// -------------------------------------
// Frequency Analysis
// -------------------------------------


function frequency(spins){


let count={

D1:0,
D2:0,
D3:0

};



spins.forEach(d=>{

count[d]++;

});


return count;


}






// -------------------------------------
// Recency Analysis
// -------------------------------------


function recency(spins){


return {

last:spins[4],

previous:spins[3],

oldest:spins[0]

};


}







// -------------------------------------
// Transition Analysis
// -------------------------------------


function transitions(spins){


let map={

D1:{},
D2:{},
D3:{}

};



for(let i=0;i<spins.length-1;i++){


let from=spins[i];

let to=spins[i+1];


if(!map[from][to])

map[from][to]=0;


map[from][to]++;


}



return map;


}








// -------------------------------------
// Rotation Detection Placeholder
// -------------------------------------


function detectRotation(spins){


let clockwise=true;

let counter=true;



for(let i=0;i<spins.length-1;i++){


let current=spins[i];

let next=spins[i+1];



if(next !== rotateClockwise(current))

clockwise=false;



if(next !== rotateCounter(current))

counter=false;



}



if(clockwise)

return "CLOCKWISE ROTATION";



if(counter)

return "COUNTER ROTATION";



return "NO ROTATION";


}







function rotateClockwise(d){


if(d==="D1")
return "D2";


if(d==="D2")
return "D3";


return "D1";


}





function rotateCounter(d){


if(d==="D1")
return "D3";


if(d==="D3")
return "D2";


return "D1";


}








// -------------------------------------
// Main Analysis
// -------------------------------------



function createRecommendation(spins){


let result =
generateDecision(spins);



session.currentExclude =
result.exclude;


session.currentPlay =
result.play;


session.pattern =
result.pattern;


session.confidence =
result.confidence;



document
.getElementById("pattern")
.innerHTML =
result.pattern;



document
.getElementById("result")
.innerHTML =

"EXCLUDE "
+
result.exclude
+
"<br><br>"
+
"PLAY "
+
result.play.join(" + ");




document
.getElementById("confidence")
.innerHTML =

Math.round(result.confidence)
+
"%";




document
.getElementById("details")
.innerHTML =


"Scores:<br><br>"

+

"D1: "
+
result.scores.D1

+
"<br>D2: "
+
result.scores.D2

+
"<br>D3: "
+
result.scores.D3

+

"<br><br>"

+

"Waiting for next dozen result.";

}




function submitLiveSpin(){


let actual =
document
.getElementById("liveSpin")
.value;



if(!session.currentExclude){

alert(
"Generate a recommendation first."
);


return;

}



session.cycles++;



if(
actual === session.currentExclude
){

session.losses++;


document
.getElementById("liveStatus")
.innerHTML =

"RESULT: EXCLUDED DOZEN HIT<br>"
+
"Cycle lost.";

}

else{


session.wins++;


document
.getElementById("liveStatus")
.innerHTML =

"RESULT: PLAY AREA HIT<br>"
+
"Cycle successful.";

}




session.history.push(actual);



let lastFive =
session.history.slice(-5);



if(lastFive.length===5){

createRecommendation(lastFive);

}


updateStats();



}




function resetSession(){

session={

history:[],
currentExclude:null,
currentPlay:[],
pattern:"",
confidence:0,
wins:0,
losses:0,
cycles:0

};


document.getElementById("pattern").innerHTML="--";

document.getElementById("result").innerHTML="--";

document.getElementById("confidence").innerHTML="--";

document.getElementById("details").innerHTML="Waiting for analysis...";

document.getElementById("stats").innerHTML="No cycles completed.";

}



function updateStats(){


document
.getElementById("stats")
.innerHTML =

"Cycles: "
+
session.cycles

+
"<br>"

+

"Successful: "
+
session.wins

+
"<br>"

+

"Failed: "
+
session.losses;

}






// =====================================
// TWO DOZEN EXCLUSION ENGINE V2
// PART 2
// PATTERN INTELLIGENCE
// SCORING ENGINE
// =====================================







// -------------------------------------
// Frequency
// -------------------------------------

function frequency(spins){

let count={
D1:0,
D2:0,
D3:0
};


spins.forEach(d=>{
count[d]++;
});


return count;

}



// -------------------------------------
// Transition Map
// -------------------------------------

function transitions(spins){

let map={

D1:{},
D2:{},
D3:{}

};


for(let i=0;i<spins.length-1;i++){

let from=spins[i];
let to=spins[i+1];


if(!map[from][to])
map[from][to]=0;


map[from][to]++;

}


return map;

}





// -------------------------------------
// Rotation Logic
// -------------------------------------

function rotateClockwise(d){

if(d==="D1")
return "D2";

if(d==="D2")
return "D3";

return "D1";

}


function rotateCounter(d){

if(d==="D1")
return "D3";

if(d==="D3")
return "D2";

return "D1";

}







// -------------------------------------
// Pattern Detection
// -------------------------------------

function detectPattern(spins){


let clockwise=true;
let counter=true;



for(let i=0;i<spins.length-1;i++){


if(
spins[i+1] !== rotateClockwise(spins[i])
)

clockwise=false;



if(
spins[i+1] !== rotateCounter(spins[i])
)

counter=false;


}



if(clockwise)
return "CLOCKWISE ROTATION";


if(counter)
return "COUNTER ROTATION";




// Alternating detection

if(
spins[0]===spins[2]
&&
spins[1]===spins[3]
&&
spins[2]===spins[4]
)

return "ALTERNATING";




// Dominant dozen

let freq=frequency(spins);

let max=Math.max(
freq.D1,
freq.D2,
freq.D3
);


if(max>=3)

return "DOMINANT DOZEN";



return "MIXED PATTERN";


}








// -------------------------------------
// Score Engine
// -------------------------------------

function scoreDozens(spins){


let scores={

D1:50,
D2:50,
D3:50

};


let freq =
frequency(spins);

let trans =
transitions(spins);




// -----------------------------
// Frequency pressure
// -----------------------------


DOZENS.forEach(d=>{


scores[d] -= freq[d]*5;


});





// -----------------------------
// Recent appearance penalty
// -----------------------------


let last =
spins[4];


scores[last]-=15;





// -----------------------------
// Transition support
// -----------------------------


let previous =
spins[3];


let nextCounts =
trans[previous];



for(let d in nextCounts){


scores[d]+=
nextCounts[d]*15;


}





// -----------------------------
// Pattern completion bonus
// -----------------------------


let pattern =
detectPattern(spins);



if(pattern==="CLOCKWISE ROTATION"){


let expected =
rotateClockwise(spins[4]);


scores[expected]+=25;


}



if(pattern==="COUNTER ROTATION"){


let expected =
rotateCounter(spins[4]);


scores[expected]+=25;


}




// Clamp

DOZENS.forEach(d=>{


if(scores[d]>100)

scores[d]=100;


if(scores[d]<0)

scores[d]=0;


});



return scores;


}









// -------------------------------------
// Choose Exclusion
// -------------------------------------

function chooseExclusion(scores){


let lowest=null;


DOZENS.forEach(d=>{


if(
lowest===null ||
scores[d]<scores[lowest]
)

lowest=d;


});


return lowest;


}








// -------------------------------------
// Confidence
// -------------------------------------

function confidence(scores){


let values=[
scores.D1,
scores.D2,
scores.D3
];


values.sort((a,b)=>b-a);



let difference =
values[0]-values[1];


return Math.min(
95,
50+difference
);


}









// -------------------------------------
// Generate Recommendation
// -------------------------------------

function generateDecision(spins){



let pattern =
detectPattern(spins);



let scores =
scoreDozens(spins);



let exclude =
chooseExclusion(scores);



let confidenceValue =
confidence(scores);





let play =
DOZENS.filter(d=>d!==exclude);





return {


pattern:pattern,

exclude:exclude,

play:play,

scores:scores,

confidence:confidenceValue


};


}









// -------------------------------------
// Analyze Button
// -------------------------------------
function analyze(){

let spins=[];

document
.querySelectorAll(".spin")
.forEach(s=>{
    spins.push(s.value);
});


let result =
generateDecision(spins);


// Save active recommendation

session.history = spins;

session.currentExclude = result.exclude;

session.currentPlay = result.play;

session.pattern = result.pattern;

session.confidence = result.confidence;



document
.getElementById("pattern")
.innerHTML =
result.pattern;



document
.getElementById("result")
.innerHTML =

"EXCLUDE "
+
result.exclude
+
"<br><br>"
+
"PLAY "
+
result.play.join(" + ");



document
.getElementById("confidence")
.innerHTML =
Math.round(result.confidence)
+
"%";



document
.getElementById("details")
.innerHTML =

"Dozen Scores:<br><br>"
+
"D1: "
+
result.scores.D1
+
"<br>D2: "
+
result.scores.D2
+
"<br>D3: "
+
result.scores.D3
+
"<br><br>"
+
"Lowest danger dozen removed.";

}


</script>


</body>

</html>
